name: Job Trend Mining Pipeline

on:
  schedule:
    # Every Monday 00:00 KST (Sunday 15:00 UTC)
    - cron: "0 15 * * 0"
  workflow_dispatch: {}

jobs:
  update-trend-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run trend mining script
        run: npm run update-trend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_API_KEY }}
